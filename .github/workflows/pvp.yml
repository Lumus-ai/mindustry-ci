name: pvp
on:
  workflow_dispatch:
    inputs:
      bots: {description: "space-separated bots; every pair plays a 1v1 on a 2-core map", default: "ours_v2 ours_v3 ours_v4int ours_v4sus prof_nemotron"}
      minutes: {description: "match length cap in minutes (real time)", default: "15"}
      map: {description: "map with 2 prebuilt cores (glacier, passage, canyon)", default: "glacier"}
      repeats: {description: "repeats per pair (sides are swapped on repeat 2)", default: "1"}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env: {BOTS: "${{ inputs.bots }}", REP: "${{ inputs.repeats }}"}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,itertools
          b=os.environ["BOTS"].split(); r=int(os.environ["REP"])
          inc=[]
          for i,(x,y) in enumerate(itertools.combinations(b,2)):
              for k in range(r):
                  p=(x,y) if k%2==0 else (y,x)
                  inc.append({"a":p[0],"b":p[1],"k":k+1,"id":f"{p[0]}_vs_{p[1]}_{k+1}"})
          assert 0<len(inc)<=100
          print("matrix="+json.dumps({"include":inc}))
          PY
  match:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - run: ./setup.sh && pip install pillow && sudo apt-get install -y -qq ffmpeg
      - name: pvp
        run: arena/pvp.sh "${{ inputs.map }}" "${{ inputs.minutes }}" "${{ matrix.a }}" "${{ matrix.b }}"
      - name: render
        if: always()
        run: cd arena && python3 render.py || true
      - name: collect
        if: always()
        run: |
          O=out/${{ matrix.id }}; mkdir -p $O
          cp arena/results/pvp_scoreboard.md arena/results/pvp_samples.log arena/results/pvp.mp4 $O/ 2>/dev/null || true
          gzip -c arena/results/snap.log > $O/snap.log.gz 2>/dev/null || true
          cp arena/srvdir/server.log $O/ 2>/dev/null || true
          for f in arena/live/*/bot.log; do cp $f $O/$(basename $(dirname $f)).log 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "pvp-${{ matrix.id }}", path: out/, retention-days: 14}

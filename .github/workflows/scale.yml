name: scale
on:
  workflow_dispatch:
    inputs:
      scales: {description: "space-separated time scales", default: "1 3 6"}
      bot: {description: "bot", default: "ours_v3"}
      minutes: {description: "minutes per scale", default: "4"}
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: "${{ steps.m.outputs.matrix }}"}
    steps:
      - id: m
        env: {S: "${{ inputs.scales }}"}
        run: python3 -c "import json,os;print('matrix='+json.dumps({'s':os.environ['S'].split()}))" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: {fail-fast: false, matrix: "${{ fromJSON(needs.plan.outputs.matrix) }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - run: ./setup.sh
      - run: arena/scale_test.sh "${{ matrix.s }}" "${{ inputs.bot }}" "${{ inputs.minutes }}" | tee scale_out.txt
      - if: always()
        run: |
          O=out/scale-${{ matrix.s }}; mkdir -p $O
          cp arena/results/scale_samples.log scale_out.txt $O/ 2>/dev/null || true
          cp arena/srvdir/server.log $O/ 2>/dev/null || true
          for f in arena/live/*/bot.log; do cp $f $O/bot.log 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "scale-${{ matrix.s }}", path: out/, retention-days: 7}
